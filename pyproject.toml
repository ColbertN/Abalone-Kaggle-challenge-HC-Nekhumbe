[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abalone-age-model"
version = "0.1.0"
description = "Reproducible abalone age-regression workflow"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
    "shap>=0.45",
]

[tool.setuptools.packages.find]
where = ["src"]
